# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Same setup as cashtracker-frontend. Worth doing because every PR runs
# the required `verify` and `e2e` checks: a bump either passes the same
# gates a human change does, or it does not. Neither job needs a secret,
# so unlike the frontend both really run on Dependabot PRs.
version: 2

updates:
  # Reads pnpm-lock.yaml - the "npm" ecosystem covers pnpm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Bogota
    groups:
      # NestJS packages only work on matching majors: a lone
      # @nestjs/passport 12 next to @nestjs/core 11 fails e2e (#23, #24).
      # Majors of the whole framework arrive as one PR, to be migrated
      # together. Listed first so it wins over the catch-all below.
      nestjs-major:
        patterns: ["@nestjs/*"]
        update-types: ["major"]
      # One PR for everything low-risk; dependabot-auto-merge.yml merges
      # it once the required checks pass.
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Other majors stay ungrouped and open for review: each one (TypeORM,
    # TypeScript, ESLint) is a migration of its own.
    ignore:
      # @types/node must match the Node major the app runs on (22, see
      # engines/Dockerfile/CI), not the latest Node. A newer major types
      # APIs that do not exist at runtime. Bump it with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits; squash-merging takes the PR title.
      prefix: chore
      prefix-development: chore
      include: scope
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Bogota
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    labels: ["dependencies", "github-actions"]

  # The Dockerfile is not listed on purpose: its base image is
  # `node:${NODE_VERSION}-alpine`, and Dependabot cannot resolve a tag
  # built from an ARG, so it would never propose anything. Bump
  # NODE_VERSION by hand.
